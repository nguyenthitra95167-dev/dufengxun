<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
    <defs>
        <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5b8def" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0.2"/>
        </linearGradient>
        <radialGradient id="globeRad" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#5b8def" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="180" fill="url(#globeRad)"/>
    <circle cx="200" cy="200" r="150" stroke="#5b8def" stroke-width="1" stroke-opacity="0.3" fill="none"/>
    <ellipse cx="200" cy="200" rx="150" ry="60" stroke="#5b8def" stroke-width="0.5" stroke-opacity="0.4" fill="none"/>
    <ellipse cx="200" cy="200" rx="150" ry="100" stroke="#5b8def" stroke-width="0.5" stroke-opacity="0.4" fill="none"/>
    <ellipse cx="200" cy="200" rx="150" ry="140" stroke="#5b8def" stroke-width="0.5" stroke-opacity="0.3" fill="none"/>
    <line x1="200" y1="50" x2="200" y2="350" stroke="#5b8def" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="50" y1="200" x2="350" y2="200" stroke="#5b8def" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- Connection points -->
    <circle cx="200" cy="80" r="4" fill="#4fc3f7"/>
    <circle cx="320" cy="160" r="4" fill="#8b7fd8"/>
    <circle cx="280" cy="290" r="4" fill="#5b8def"/>
    <circle cx="120" cy="290" r="4" fill="#4fc3f7"/>
    <circle cx="80" cy="160" r="4" fill="#8b7fd8"/>
    <!-- Connection lines -->
    <line x1="200" y1="80" x2="320" y2="160" stroke="#5b8def" stroke-width="0.5" stroke-opacity="0.6" stroke-dasharray="3 3"/>
    <line x1="320" y1="160" x2="280" y2="290" stroke="#5b8def" stroke-width="0.5" stroke-opacity="0.6" stroke-dasharray="3 3"/>
    <line x1="280" y1="290" x2="120" y2="290" stroke="#5b8def" stroke-width="0.5" stroke-opacity="0.6" stroke-dasharray="3 3"/>
    <line x1="120" y1="290" x2="80" y2="160" stroke="#5b8def" stroke-width="0.5" stroke-opacity="0.6" stroke-dasharray="3 3"/>
    <line x1="80" y1="160" x2="200" y2="80" stroke="#5b8def" stroke-width="0.5" stroke-opacity="0.6" stroke-dasharray="3 3"/>
</svg>
